 .ai-search{max-width:700px;margin:25px auto;padding:20px;background:#111;border:1px solid #292929;border-radius:8px}.ai-title{font-weight:bold;color:#e50914;margin-bottom:12px}.ai-search input{width:100%;padding:14px;background:#080808;color:#fff;border:1px solid #444;border-radius:5px;font-size:15px}.no-result{color:#777;margin-top:15px}.ai-search{max-width:700px;margin:25px auto;padding:20px;background:#111;border:1px solid #292929;border-radius:10px}.ai-search b{display:block;color:#e50914;margin-bottom:12px}.ai-search input{width:100%;padding:14px;background:#080808;color:white;border:1px solid #444;border-radius:6px}.ai-search #aiResults{margin-top:12px;color:#888}</style>

<script>function aiRecommend(){let q=document.getElementById("aiInput").value.toLowerCase();document.querySelectorAll(".card").forEach(c=>c.style.display=(!q||c.innerText.toLowerCase().includes(q))?"flex":"none")}</script><script>fetch("/api/me").then(r=>r.ok?r.json():null).then(u=>{if(!u)return;let e=document.getElementById("account");if(u.username==="Zexxofficial"){document.getElementById("ownerPanel").style.display="block";e.innerHTML="<span style=\"font-family:Georgia,serif;font-weight:900;color:#ff1744;text-shadow:0 0 6px #f00,0 0 18px #e50914,0 0 30px #f00;letter-spacing:2px\">✦ "+u.username+" ✦</span>"}else{e.innerHTML="<span style=\"color:#bbb\">"+u.username+"</span>"}}).catch(()=>{});</script><script>function toggleAccountMenu(){var m=document.getElementById("accountMenu");m.style.display=m.style.display==="none"?"block":"none"}function previewProfile(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){document.getElementById("profilePreview").innerHTML="<img src=\""+r.result+"\" style=\"width:70px;height:70px;border-radius:50%;object-fit:cover\">"};r.readAsDataURL(f)}fetch("/api/me").then(function(r){return r.ok?r.json():null}).then(function(u){if(u){document.getElementById("menuUsername").textContent=u.username}}).catch(function(){});</script></body>
